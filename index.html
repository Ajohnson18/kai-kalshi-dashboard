<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KALSHI BETS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;700&family=Bebas+Neue&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<!-- Lucide icons -->
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
  :root {
    --bg: #f2f0ec;
    --surface: #ffffff;
    --black: #0a0a0a;
    --muted: #888;
    --dim: #d0cec9;
    --neon: #009922;
    --hot: #FF0066;
    --volt: #c8aa00;
    --elec: #0099CC;
    --warn: #cc4400;
    --border: 3px solid #0a0a0a;
    --border-hot: 3px solid #FF0066;
    --border-neon: 3px solid #009922;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--black);
    font-family: 'Space Grotesk', sans-serif;
    font-size: 14px;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ═══ SCROLLBAR ═══ */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--dim); }
  ::-webkit-scrollbar-thumb { background: var(--hot); }

  /* ═══ HEADER ═══ */
  header {
    background: var(--surface);
    border-bottom: 4px solid var(--hot);
    padding: 0 24px;
    display: flex;
    align-items: stretch;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
    height: 56px;
  }

  .header-left {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  header h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 28px;
    letter-spacing: 3px;
    color: var(--black);
    line-height: 1;
  }

  .header-tag {
    background: var(--hot);
    color: #fff;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    font-weight: 700;
    padding: 3px 7px;
    letter-spacing: 1px;
    text-transform: uppercase;
    align-self: center;
  }

  .live-badge {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .dot {
    width: 8px;
    height: 8px;
    background: var(--neon);
    animation: blink 1.4s infinite;
    flex-shrink: 0;
  }

  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.2} }

  /* ═══ LAYOUT ═══ */
  .page {
    max-width: 900px;
    margin: 0 auto;
    padding: 24px 18px 80px;
  }

  /* ═══ STAT ROW ═══ */
  .stats-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 0;
    margin-bottom: 24px;
    border: var(--border);
    background: var(--surface);
  }

  .stat {
    padding: 16px 18px;
    border-right: var(--border);
    position: relative;
    overflow: hidden;
    background: var(--surface);
  }

  .stat:last-child { border-right: none; }

  .stat::before {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 3px;
    height: 100%;
  }
  .stat:nth-child(1)::before { background: var(--elec); }
  .stat:nth-child(2)::before { background: var(--neon); }
  .stat:nth-child(3)::before { background: var(--volt); }
  .stat:nth-child(4)::before { background: var(--hot); }

  .stat .n {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 36px;
    line-height: 1;
    color: var(--black);
    letter-spacing: 1px;
  }

  .stat .n.g { color: var(--neon); }

  .stat .l {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin-top: 4px;
  }

  /* ═══ SECTION LABELS ═══ */
  .sec {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 20px;
    letter-spacing: 4px;
    color: var(--black);
    margin: 28px 0 10px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .sec::after {
    content: '';
    flex: 1;
    height: 2px;
    background: var(--black);
    opacity: 0.15;
  }

  .sec-sub {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1px;
    font-weight: 400;
  }

  /* ═══ SETTLING BANNER ═══ */
  #settling-banner {
    border: 3px solid var(--warn);
    padding: 12px 16px;
    margin-bottom: 16px;
    background: rgba(204,68,0,0.06);
    display: none;
  }

  .settling-title {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    font-weight: 700;
    color: var(--warn);
    letter-spacing: 2px;
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  #settling-list {
    margin-top: 8px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    line-height: 2;
  }

  /* ═══ BET CARD ═══ */
  .bet-card {
    border: var(--border);
    margin-bottom: 6px;
    cursor: pointer;
    position: relative;
    background: var(--surface);
    transition: border-color .1s, background .1s;
  }

  .bet-card:hover {
    border-color: var(--hot);
    background: #fafafa;
  }

  .bet-card.live {
    border-color: var(--hot);
  }

  .bet-card.live::after {
    content: 'LIVE';
    position: absolute;
    top: -1px;
    right: 12px;
    background: var(--hot);
    color: #fff;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 13px;
    letter-spacing: 2px;
    padding: 2px 8px;
  }

  .card-top {
    padding: 16px 18px 12px;
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 16px;
    align-items: start;
  }

  .bet-title {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 14px;
    font-weight: 700;
    margin-bottom: 8px;
    line-height: 1.4;
    color: var(--black);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  /* ═══ TAGS ═══ */
  .tags { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; }

  .tag {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 2px 7px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .tag.for     { background: #d4f7dc; color: #006b1a; border: 1.5px solid #009922; }
  .tag.against { background: #ffe0ef; color: #c00050; border: 1.5px solid #FF0066; }
  .tag.live-tag { background: var(--hot); color: #fff; }
  .tag.paper   { border: 1.5px solid var(--dim); color: var(--muted); background: transparent; }
  .tag.ec      { border: 1.5px solid var(--elec); color: var(--elec); }
  .tag.sp      { border: 1.5px solid var(--warn); color: var(--warn); }
  .tag.po      { border: 1.5px solid #9333ea; color: #9333ea; }
  .tag.co      { border: 1.5px solid var(--neon); color: var(--neon); }

  .reason-short {
    font-size: 12px;
    color: var(--muted);
    line-height: 1.5;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .closes {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    margin-top: 6px;
    letter-spacing: 1px;
  }

  .hint {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    color: var(--dim);
    margin-top: 5px;
    letter-spacing: 1px;
  }

  /* ═══ BET RIGHT ═══ */
  .bet-right {
    text-align: right;
    flex-shrink: 0;
    min-width: 110px;
  }

  .ev-big {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 36px;
    color: var(--neon);
    line-height: 1;
    letter-spacing: 1px;
  }

  .ev-sub {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .odds {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    margin-top: 5px;
  }

  .odds .site  { color: var(--hot); font-weight: 700; }
  .odds .ours  { color: var(--neon); font-weight: 700; }

  /* confidence pips */
  .pips {
    display: flex;
    justify-content: flex-end;
    gap: 3px;
    margin-top: 6px;
  }

  .pip {
    width: 7px;
    height: 7px;
    background: var(--dim);
  }

  .pip.on { background: var(--black); }

  .trend {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    font-weight: 700;
    margin-top: 4px;
    letter-spacing: 0.5px;
  }

  .trend.up   { color: var(--neon); }
  .trend.down { color: var(--hot); }
  .trend.flat { color: var(--dim); }

  /* ═══ MINI SPARKLINE ═══ */
  .card-chart {
    padding: 0 18px 12px;
    border-top: 1px solid var(--dim);
    background: #fafaf8;
  }

  .spark-wrap { height: 44px; margin-top: 8px; }

  /* ═══ HIDE BUTTON ═══ */
  .hide-btn {
    position: absolute;
    top: 10px;
    right: 10px;
    width: 24px;
    height: 24px;
    border: 1.5px solid var(--dim);
    background: var(--surface);
    color: var(--muted);
    cursor: pointer;
    font-size: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: opacity .1s;
    z-index: 2;
  }

  .bet-card:hover .hide-btn, .hide-btn:focus { opacity: 1; }
  .hide-btn:hover { border-color: var(--hot); color: var(--hot); }

  .show-hidden-bar { text-align: center; padding: 8px 0; margin-top: 2px; }

  .show-hidden-btn {
    background: none;
    border: 1.5px solid var(--dim);
    padding: 5px 16px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    cursor: pointer;
    letter-spacing: 1px;
    text-transform: uppercase;
    transition: .1s;
  }

  .show-hidden-btn:hover { border-color: var(--black); color: var(--black); }

  /* ═══ OVERLAY + MODAL ═══ */
  .overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.45);
    z-index: 200;
  }

  .overlay.open { display: block; }

  .modal {
    position: fixed;
    top: 0;
    right: -100%;
    width: min(700px, 100%);
    height: 100%;
    background: var(--surface);
    border-left: 4px solid var(--hot);
    z-index: 201;
    transition: right .2s cubic-bezier(.4,0,.2,1);
    overflow-y: auto;
    display: flex;
    flex-direction: column;
  }

  .modal.open { right: 0; }

  .modal-header {
    padding: 18px 22px 14px;
    border-bottom: 2px solid var(--dim);
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    position: sticky;
    top: 0;
    background: var(--surface);
    z-index: 5;
  }

  .modal-title {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 15px;
    font-weight: 700;
    line-height: 1.4;
    max-width: calc(100% - 44px);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--black);
  }

  .close-btn {
    width: 32px;
    height: 32px;
    border: 2px solid var(--dim);
    background: none;
    cursor: pointer;
    color: var(--muted);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    margin-left: 12px;
    transition: .1s;
  }

  .close-btn:hover { border-color: var(--hot); color: var(--hot); }

  .modal-body { padding: 22px; flex: 1; }

  /* ═══ MODAL SECTIONS ═══ */
  .msec { margin-bottom: 26px; }

  .msec-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 16px;
    letter-spacing: 3px;
    color: var(--black);
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  /* verdict */
  .verdict-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
    margin-bottom: 22px;
  }

  .verdict-box {
    border: 2px solid var(--dim);
    padding: 14px 14px;
    text-align: center;
    position: relative;
    overflow: hidden;
    background: var(--surface);
  }

  .verdict-box::before {
    content: '';
    position: absolute;
    bottom: 0; left: 0;
    width: 100%;
    height: 3px;
  }

  .verdict-box.green { border-color: var(--neon); background: #f0fdf4; }
  .verdict-box.green::before { background: var(--neon); }

  .verdict-box.red   { border-color: var(--hot); background: #fff0f5; }
  .verdict-box.red::before   { background: var(--hot); }

  .verdict-box.blue  { border-color: var(--elec); background: #f0f8ff; }
  .verdict-box.blue::before  { background: var(--elec); }

  .verdict-box .vn {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 24px;
    line-height: 1;
    letter-spacing: 1px;
    color: var(--black);
  }

  .verdict-box .vl {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    margin-top: 4px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  /* charts */
  .chart-box {
    background: #fafaf8;
    border: 2px solid var(--dim);
    padding: 14px;
    margin-bottom: 14px;
  }

  .chart-box canvas { width: 100%!important; max-height: 200px; }

  /* sources table */
  .sources-table { width: 100%; border-collapse: collapse; }

  .sources-table th {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--muted);
    text-align: left;
    padding: 6px 10px;
    border-bottom: 2px solid var(--dim);
  }

  .sources-table td {
    padding: 10px 10px;
    border-bottom: 1px solid #eee;
    font-size: 12px;
    vertical-align: middle;
  }

  .sources-table tr:last-child td { border-bottom: none; }
  .sources-table tr:hover td { background: #f8f8f5; }

  .src-name { font-weight: 600; color: var(--black); }
  .src-meta { font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--muted); margin-top: 2px; }

  .src-val { font-family: 'IBM Plex Mono', monospace; font-weight: 700; }
  .src-val.up      { color: var(--hot); }
  .src-val.down    { color: var(--neon); }
  .src-val.neutral { color: var(--elec); }

  .src-check {
    font-size: 14px;
    width: 20px;
  }

  /* reasoning */
  .reasoning-text {
    font-size: 13px;
    color: #444;
    line-height: 1.7;
    background: #fafaf8;
    border-left: 3px solid var(--hot);
    padding: 14px 16px;
  }

  .reasoning-text p { margin-bottom: 10px; }
  .reasoning-text p:last-child { margin-bottom: 0; }

  /* EV math */
  .ev-math {
    background: #f0fdf4;
    border: 1px solid #bbf7d0;
    padding: 12px 14px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--neon);
  }

  .ev-math strong { font-size: 14px; color: var(--neon); }

  /* kalshi button */
  .kalshi-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    text-align: center;
    background: var(--black);
    color: #fff;
    text-decoration: none;
    padding: 14px;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 20px;
    letter-spacing: 3px;
    margin-top: 20px;
    transition: .1s;
  }

  .kalshi-btn:hover { background: var(--hot); }

  .empty-msg {
    padding: 32px;
    text-align: center;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--dim);
    text-transform: uppercase;
    letter-spacing: 2px;
  }

  /* ═══ PERF CARD ═══ */
  .perf-card {
    background: var(--surface);
    border: 2px solid var(--dim);
    padding: 14px 18px;
    margin-bottom: 6px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .perf-card:hover { border-color: var(--black); }

  .perf-label {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    font-size: 13px;
    color: var(--black);
  }

  .perf-meta {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    margin-top: 3px;
    letter-spacing: 0.5px;
  }

  .perf-pnl {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 28px;
    letter-spacing: 1px;
  }

  .perf-pnl.pos { color: var(--neon); }
  .perf-pnl.neu { color: var(--dim); }

  /* ═══ FOOTER ═══ */
  .footer-bar {
    text-align: center;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    color: var(--dim);
    margin-top: 32px;
    text-transform: uppercase;
    letter-spacing: 2px;
  }

  .footer-bar a { color: var(--muted); text-decoration: none; }
  .footer-bar a:hover { color: var(--hot); }

  /* ═══ RESPONSIVE ═══ */
  @media (max-width: 600px) {
    .stats-row { grid-template-columns: repeat(2, 1fr); }
    .card-top  { grid-template-columns: 1fr; }
    .bet-right { text-align: left; }
    .pips      { justify-content: flex-start; }
    .verdict-row { grid-template-columns: 1fr 1fr; }
  }

  /* ═══ ICON SIZING ═══ */
  .icon-sm { width: 14px; height: 14px; display: inline-block; vertical-align: middle; }
  .icon-xs { width: 12px; height: 12px; display: inline-block; vertical-align: middle; }
</style>
</head>
<body>

<header>
  <div class="header-left">
    <h1>KALSHI</h1>
    <span class="header-tag">EDGE ENGINE</span>
  </div>
  <div class="live-badge">
    <span class="dot"></span>
    <span id="upd">LOADING...</span>
  </div>
</header>

<div class="overlay" id="overlay" onclick="closeModal()"></div>

<div class="modal" id="modal">
  <div class="modal-header">
    <div class="modal-title" id="modal-title">—</div>
    <button class="close-btn" onclick="closeModal()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>
  <div class="modal-body" id="modal-body"></div>
</div>

<div class="page">
  <!-- STATS ROW -->
  <div class="stats-row">
    <div class="stat">
      <div class="n" id="s1">—</div>
      <div class="l">OPEN BETS</div>
    </div>
    <div class="stat">
      <div class="n g" id="s2">$0</div>
      <div class="l">TOTAL P&amp;L</div>
    </div>
    <div class="stat">
      <div class="n g" id="s3">—</div>
      <div class="l">BEST EV / $10</div>
    </div>
    <div class="stat">
      <div class="n" id="s4">—</div>
      <div class="l">DATA SIGNALS</div>
    </div>
  </div>

  <!-- SETTLING SOON -->
  <div id="settling-banner">
    <div class="settling-title">
      <svg class="icon-xs" viewBox="0 0 24 24" fill="none" stroke="#cc4400" stroke-width="2.5" stroke-linecap="square"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      SETTLING SOON
    </div>
    <div id="settling-list"></div>
  </div>

  <!-- LIVE BETS -->
  <div class="sec" id="live-title" style="display:none">
    <svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="#FF0066" stroke-width="2.5" stroke-linecap="square"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3" fill="#FF0066"/></svg>
    LIVE — REAL MONEY
  </div>
  <div id="live-bets"></div>

  <!-- ALL BETS -->
  <div class="sec">
    <svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="#0a0a0a" stroke-width="2.5" stroke-linecap="square"><rect x="3" y="3" width="18" height="18"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/><line x1="9" y1="3" x2="9" y2="21"/><line x1="15" y1="3" x2="15" y2="21"/></svg>

function formatModelNote(note) {
  if (!note) return null;
  if (note.includes('active_bets.json')) return null;
  return note.split(/\n\n+/).map(function(p) {
    var t = p.trim();
    if (!t) return '';
    var r = t.replace(/\n/g, '<br>');
    return '<p>' + r + '</p>';
  }).filter(Boolean).join('');
}

  db:    `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#bbb" stroke-width="2.5" stroke-linecap="square"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></svg>`,
  arrow: `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square"><line x1="7" y1="17" x2="17" y2="7"/><polyline points="7 7 17 7 17 17"/></svg>`,
  trend: `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#0a0a0a" stroke-width="2.5" stroke-linecap="square"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>`,
  brain: `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#0a0a0a" stroke-width="2.5" stroke-linecap="square"><path d="M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-4.96-.44 2.5 2.5 0 0 1-2.96-3.08 3 3 0 0 1-.34-5.58 2.5 2.5 0 0 1 1.32-4.24 2.5 2.5 0 0 1 1.98-3A2.5 2.5 0 0 1 9.5 2Z"/><path d="M14.5 2A2.5 2.5 0 0 0 12 4.5v15a2.5 2.5 0 0 0 4.96-.44 2.5 2.5 0 0 0 2.96-3.08 3 3 0 0 0 .34-5.58 2.5 2.5 0 0 0-1.32-4.24 2.5 2.5 0 0 0-1.98-3A2.5 2.5 0 0 0 14.5 2Z"/></svg>`,
  src:   `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#0a0a0a" stroke-width="2.5" stroke-linecap="square"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>`,
  settle:`<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#0a0a0a" stroke-width="2.5" stroke-linecap="square"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>`,
};

function openBet(ticker) {
  const b = allBets.find(x=>x.ticker===ticker);
  if (!b) return;

  modalCharts.forEach(c=>c.destroy());
  modalCharts = [];

  const history    = histMap[ticker] || [];
  const isFOR      = b.side === 'YES';
  const ev         = parseFloat(b.ev_per_10||0);
  const modelP     = parseFloat(b.model_p||0);
  const mktMid     = parseFloat(b.mkt_mid||0);
  const conf       = parseInt(b.confidence||0);
  const data       = BET_DATA[ticker] || {};
  const isBracket  = ticker.startsWith('KXECONSTATCPI');
  const eventBase  = ticker.replace(/-T[-\d.]+$/, '');
  const tickPart   = ticker.match(/-T([-\d.]+)$/)?.[1];
  const activeTick = tickPart != null ? parseFloat(tickPart).toFixed(1).replace('.0','')+'%' : null;
  const srcs       = relevantSources(ticker);

  let trendHtml = '';
  if (history.length >= 2) {
    const delta = ev - parseFloat(history[history.length-2]?.ev_per_10||0);
    if (Math.abs(delta) > 0.05) {
      trendHtml = `<div style="font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:700;margin-top:6px;color:${delta>0?'#009922':'#FF0066'}">${delta>0?'↑ BETTER':'↓ WORSE'} THAN YESTERDAY BY $${Math.abs(delta).toFixed(2)}</div>`;
    }
  }

  const FEE = 0.07;
  const evMath = isFOR
    ? `BUY YES @ ${Math.round(mktMid*100)}¢ ASK. WIN: ${((1-mktMid)*(1-FEE)*100).toFixed(1)}¢ NET. EV = ${(modelP*100).toFixed(0)}% × ${((1-mktMid)*(1-FEE)*100).toFixed(1)}¢ − ${((1-modelP)*mktMid*100).toFixed(1)}¢ = <strong style="color:#009922">+${(ev).toFixed(2)}¢ PER DOLLAR</strong>`
    : `BUY NO @ ${Math.round((1-mktMid)*100)}¢. WIN: ${(mktMid*(1-FEE)*100).toFixed(1)}¢ NET. EV = ${((1-modelP)*100).toFixed(0)}% × ${(mktMid*(1-FEE)*100).toFixed(1)}¢ − ${(modelP*(1-mktMid)*100).toFixed(1)}¢ = <strong style="color:#009922">+${(ev).toFixed(2)}¢ PER DOLLAR</strong>`;

  document.getElementById('modal-title').textContent = b.title || ticker;
  document.getElementById('modal-body').innerHTML = `
    <div class="verdict-row">
      <div class="verdict-box ${isFOR?'green':'red'}">
        <div class="vn" style="color:${isFOR?'#009922':'#FF0066'}">${isFOR?'FOR IT':'AGAINST'}</div>
        <div class="vl">OUR CALL</div>
      </div>
      <div class="verdict-box blue">
        <div class="vn" style="color:#009922">+$${ev.toFixed(2)}</div>
        <div class="vl">EXPECTED / $10${trendHtml}</div>
      </div>
      <div class="verdict-box" style="border-color:#333">
        <div class="vn" style="font-size:18px;color:#888;letter-spacing:1px">${daysLeft(b.closes)||'—'}</div>
        <div class="vl">SETTLES ${fmtDate(b.closes)}</div>
      </div>
    </div>

    <div class="msec">
      <div class="msec-title">${ICONS.trend} PRICE HISTORY</div>
      <div class="chart-box">
        <div style="height:190px"><canvas id="mc-history"></canvas></div>
        ${history.length < 2 ? '<div style="text-align:center;font-family:\'IBM Plex Mono\',monospace;font-size:10px;color:#333;margin-top:8px;letter-spacing:1px;text-transform:uppercase">More data points appear daily</div>' : ''}
      </div>
    </div>

    <div class="msec">
      <div class="msec-title">${ICONS.brain} ${isBracket ? 'BUCKET PROBABILITY' : 'MODEL VS MARKET'}</div>
      <div class="chart-box">
        <div style="height:90px"><canvas id="mc-model"></canvas></div>
        <div style="font-family:'IBM Plex Mono',monospace;font-size:10px;color:#444;margin-top:10px;padding:0 2px;line-height:1.6;text-transform:uppercase;letter-spacing:0.5px">${evMath}</div>
      </div>
    </div>

    ${isBracket ? `<div class="msec">
      <div class="msec-title">${ICONS.brain} FULL CPI DISTRIBUTION</div>
      <div class="chart-box">
        <div style="height:200px"><canvas id="mc-bracket"></canvas></div>
        <div style="font-family:'IBM Plex Mono',monospace;font-size:10px;color:#888;margin-top:10px;text-transform:uppercase;letter-spacing:0.5px;line-height:1.8">
          <span style="color:#FF0066">■</span> HIGHLIGHTED = THIS MARKET'S BUCKET &nbsp;·&nbsp;
          <span style="color:#ccc">■</span> GRAY = MARKET &nbsp;·&nbsp;
          <span style="color:#009922">■</span> GREEN = MODEL
        </div>
      </div>
    </div>` : ''}

    <div class="msec">
      <div class="msec-title">${ICONS.brain} WHY WE MADE THIS BET</div>
      <div class="reasoning-text">${formatModelNote(b.model_note) || data.why || '<p style="color:#333;font-style:italic">Reasoning not yet populated.</p>'}</div>
    </div>

    ${srcs.length ? `<div class="msec">
      <div class="msec-title">${ICONS.src} DATA SOURCES</div>
      <table class="sources-table">
        <thead><tr><th></th><th>SOURCE</th><th>READING</th><th>NOTE</th></tr></thead>
        <tbody>${srcs.map(s=>`<tr>
          <td>${s.confirmed ? ICONS.check : ICONS.db}</td>
          <td><div class="src-name">${esc(s.name)}</div></td>
          <td class="src-val ${s.dir}">${s.dir==='UP'?'↑ ':'↓ '}${esc(s.val)}</td>
          <td class="src-meta">${esc(s.desc)}</td>
        </tr>`).join('')}</tbody>
      </table>
      <div style="font-family:'IBM Plex Mono',monospace;font-size:10px;color:#333;margin-top:8px;text-transform:uppercase;letter-spacing:1px">GREEN CHECK = LIVE FROM DB &nbsp;·&nbsp; GRAY = REFERENCE</div>
    </div>` : ''}

    <div class="msec">
      <div class="msec-title">${ICONS.settle} SETTLEMENT</div>
      <div style="font-family:'IBM Plex Mono',monospace;font-size:12px;color:#666;letter-spacing:0.5px;text-transform:uppercase">${esc(data.settles||fmtDate(b.closes))}</div>
    </div>

    <a class="kalshi-btn" href="${kalshiUrl(ticker)}" target="_blank">
      PLACE THIS BET ON KALSHI
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square"><line x1="7" y1="17" x2="17" y2="7"/><polyline points="7 7 17 7 17 17"/></svg>
    </a>
  `;

  setTimeout(() => {
    drawModalChart('mc-history', history);
    drawModelChart('mc-model', modelP, mktMid, isFOR);
    if (isBracket) drawBracketChart('mc-bracket', eventBase, activeTick);
  }, 50);

  document.getElementById('overlay').classList.add('open');
  document.getElementById('modal').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  document.getElementById('overlay').classList.remove('open');
  document.getElementById('modal').classList.remove('open');
  document.body.style.overflow = '';
}
document.addEventListener('keydown', e => { if(e.key==='Escape') closeModal(); });

function buildSourceMap(readings) {
  readings.forEach(r => {
    const k = r.source+'|'+r.metric;
    if (!sourceMap[k] || r.fetched_at > sourceMap[k].fetched_at) sourceMap[k] = r;
  });
}

function cardHTML(b) {
  const isLive = b.status==='LIVE';
  const isFOR  = b.side==='YES';
  const ev     = parseFloat(b.ev_per_10||0);
  const modelP = Math.round(parseFloat(b.model_p||0)*100);
  const mktP   = Math.round(parseFloat(b.mkt_mid||0)*100);
  const conf   = parseInt(b.confidence||0);
  const cat    = (b.category||'').toLowerCase();
  const history= histMap[b.ticker]||[];
  const canvasId = 'spark-'+b.ticker.replace(/[^a-z0-9]/gi,'-');

  let trendCls='flat', trendTxt='UNCHANGED';
  if (history.length>=2) {
    const delta = ev - parseFloat(history[history.length-2]?.ev_per_10||0);
    if (delta>0.05){ trendCls='up'; trendTxt=`↑ +$${delta.toFixed(2)} SINCE YESTERDAY`; }
    else if(delta<-0.05){ trendCls='down'; trendTxt=`↓ $${delta.toFixed(2)} SINCE YESTERDAY`; }
  }

  const pips = Array.from({length:10},(_,i)=>`<div class="pip${i<conf?' on':''}"></div>`).join('');

  return `<div class="bet-card${isLive?' live':''}" onclick="openBet('${b.ticker}')">
    <button class="hide-btn" onclick="hideBet('${b.ticker}',event)" title="Hide">
      <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="square"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
    <div class="card-top">
      <div>
        <div class="bet-title">${esc(b.title||b.ticker)}</div>
        <div class="tags">
          <span class="tag ${isFOR?'for':'against'}">${isFOR?'FOR IT':'AGAINST'}</span>
          <span class="tag ${CAT[cat]||'paper'}">${esc(b.category||'')}</span>
          <span class="tag ${isLive?'live-tag':'paper'}">${isLive?'LIVE':'PAPER'}</span>
        </div>
        <div class="hint">// CLICK FOR FULL BREAKDOWN + CHARTS</div>
      </div>
      <div class="bet-right">
        <div class="ev-big">+$${ev.toFixed(2)}</div>
        <div class="ev-sub">PER $10</div>
        <div class="odds">MKT: <span class="site">${mktP}%</span> &rarr; OURS: <span class="ours">${modelP}%</span></div>
        <div class="pips">${pips}</div>
        <div class="trend ${trendCls}">${trendTxt}</div>
      </div>
    </div>
    <div class="card-chart">
      <div class="spark-wrap"><canvas id="${canvasId}" height="44"></canvas></div>
    </div>
  </div>`;
}

// ── Hide management ──────────────────────────────────────────────────────
const HIDDEN_KEY = 'kalshi_hidden';
function getHidden() {
  try { return new Set(JSON.parse(localStorage.getItem(HIDDEN_KEY) || '[]')); }
  catch { return new Set(); }
}
function saveHidden(s) { localStorage.setItem(HIDDEN_KEY, JSON.stringify([...s])); }

function hideBet(ticker, e) {
  e.stopPropagation();
  const h = getHidden(); h.add(ticker); saveHidden(h);
  renderBetCards();
}

window._showHidden = false;
function toggleShowHidden() { window._showHidden = !window._showHidden; renderBetCards(); }

function renderBetCards() {
  const hidden = getHidden();
  const live   = allBets.filter(b => b.status === 'LIVE');
  const paper  = allBets.filter(b => b.status !== 'LIVE');
  const visible= paper.filter(b => window._showHidden || !hidden.has(b.ticker));
  const hiddenCount = paper.filter(b => hidden.has(b.ticker)).length;

  if (live.length) {
    document.getElementById('live-title').style.display = 'flex';
    document.getElementById('live-bets').innerHTML = live.map(cardHTML).join('');
  }
  document.getElementById('all-bets').innerHTML =
    visible.map(cardHTML).join('') || '<div class="empty-msg">NO TRACKED BETS</div>';

  const bar = document.getElementById('show-hidden-bar');
  if (hiddenCount > 0) {
    bar.innerHTML = '<button class="show-hidden-btn" onclick="toggleShowHidden()">'
      + (window._showHidden
          ? 'HIDE ' + hiddenCount + ' HIDDEN BET' + (hiddenCount===1?'':'S')
          : 'SHOW ' + hiddenCount + ' HIDDEN BET' + (hiddenCount===1?'':'S'))
      + '</button>';
    bar.style.display = 'block';
  } else {
    bar.style.display = 'none';
  }

  setTimeout(() => {
    [...live, ...visible].forEach(b => {
      const h = histMap[b.ticker] || [];
      const canvasId = 'spark-' + b.ticker.replace(/[^a-z0-9]/gi, '-');
      drawMiniChart(canvasId, h);
    });
  }, 100);
}

async function refresh() {
  document.getElementById('upd').textContent = 'REFRESHING...';

  const [bets, history, readings, perf] = await Promise.all([
    sb('bets','select=*&resolved_at=is.null&order=ev_per_10.desc.nullslast'),
    sb('price_history','ticker,recorded_at,market_mid,ev_per_10,confidence,model_p&order=recorded_at.asc'),
    sb('source_readings','source,metric,value,direction,period,fetched_at&order=fetched_at.desc'),
    sb('bet_performance','*'),
  ]);

  if (!Array.isArray(bets)) return;

  allBets = bets;
  const _now = new Date();
  allBets = allBets.map(b => ({
    ...b,
    status: b.size_dollars ? 'LIVE' : 'PAPER',
    days_left: b.closes ? Math.ceil((new Date(b.closes) - _now) / 86400000) : null,
  }));

  if (Array.isArray(history)) {
    histMap = {};
    history.forEach(h => { (histMap[h.ticker]=histMap[h.ticker]||[]).push(h); });
  }
  if (Array.isArray(readings)) buildSourceMap(readings);

  const top = [...bets].sort((a,b)=>parseFloat(b.ev_per_10)-parseFloat(a.ev_per_10))[0];
  document.getElementById('s1').textContent = bets.length;
  document.getElementById('s3').textContent = top?'+$'+parseFloat(top.ev_per_10).toFixed(2):'—';

  let upSig=0;
  if (Array.isArray(readings)) {
    const latest={};
    readings.forEach(r=>{const k=r.source+'|'+r.metric;if(!latest[k])latest[k]=r;});
    ['Cleveland Fed|cpi_mom','BLS Import Prices|import_pct','BLS PPI|ppi_pct','BLS CPI Energy|energy_cpi_pct','EIA Gas|avg_price_usd'].forEach(k=>{if(latest[k]?.direction==='UP')upSig++;});
  }
  document.getElementById('s4').textContent = upSig+'/5';

  const today = new Date(); today.setHours(0,0,0,0);
  const soon = bets.filter(b => {
    if (!b.closes) return false;
    const d = new Date(b.closes); d.setHours(0,0,0,0);
    return (d - today) / 86400000 <= 21;
  }).sort((a,b) => new Date(a.closes) - new Date(b.closes));
  const settlingBanner = document.getElementById('settling-banner');
  const settlingList   = document.getElementById('settling-list');
  if (soon.length) {
    settlingBanner.style.display = 'block';
    settlingList.innerHTML = soon.map(b => {
      const d = Math.ceil((new Date(b.closes) - today) / 86400000);
      return `<span style="margin-right:16px"><strong style="color:#cc4400">${b.ticker}</strong> ${b.side} — <strong>${d}D</strong></span>`;
    }).join('<br>');
  } else {
    settlingBanner.style.display = 'none';
  }

  renderBetCards();

  if (Array.isArray(perf) && perf.length) {
    const totalPnl = perf.reduce((s,p)=>s+parseFloat(p.real_pnl||0),0);
    const pnlEl = document.getElementById('s2');
    pnlEl.textContent = (totalPnl>=0?'+$':'-$')+Math.abs(totalPnl).toFixed(2);
    pnlEl.className = 'n'+(totalPnl>0?' g':'');
    document.getElementById('perf').innerHTML = perf.map(p=>{
      const pnl=parseFloat(p.real_pnl||0),res=parseInt(p.resolved||0),wins=parseInt(p.wins||0);
      return `<div class="perf-card">
        <div>
          <div class="perf-label">${esc(p.category)}</div>
          <div class="perf-meta">${p.total} TRACKED · ${res} SETTLED${res>0?` · ${Math.round(wins/res*100)}% WIN RATE`:''}</div>
        </div>
        <div class="perf-pnl ${pnl>0?'pos':'neu'}">${pnl!==0?(pnl>0?'+$':'-$')+Math.abs(pnl).toFixed(2):'—'}</div>
      </div>`;
    }).join('');
  } else {
    document.getElementById('perf').innerHTML = '<div class="empty-msg">FIRST BETS SETTLE APRIL 30. P&L APPEARS HERE.</div>';
  }

  document.getElementById('upd').textContent = 'UPDATED ' + new Date().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
}

refresh();
setInterval(refresh, 5*60*1000);
</script>
