<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kalshi Bets</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:#f4f3f0;color:#1a1a1a;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:15px;}

  /* ── Header ── */
  header{background:#1a1a1a;color:#fff;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
  header h1{font-size:16px;font-weight:700;}
  .live-badge{display:flex;align-items:center;gap:6px;font-size:12px;color:#aaa;}
  .dot{width:7px;height:7px;border-radius:50%;background:#4ade80;animation:blink 2s infinite;}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}

  /* ── List view ── */
  .page{max-width:860px;margin:0 auto;padding:24px 18px 60px;}
  .stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:22px;}
  .stat{background:#fff;border:1.5px solid #e8e5e0;border-radius:10px;padding:14px 16px;}
  .stat .n{font-size:24px;font-weight:800;line-height:1;}
  .stat .n.g{color:#15803d;}
  .stat .l{font-size:11px;color:#999;margin-top:3px;}
  .sec{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:#999;margin:22px 0 10px;}

  /* ── Bet card (list) ── */
  .bet-card{background:#fff;border:1.5px solid #e8e5e0;border-radius:12px;margin-bottom:10px;cursor:pointer;transition:box-shadow .15s,border-color .15s;}
  .bet-card:hover{box-shadow:0 4px 16px rgba(0,0,0,.1);border-color:#ccc;}
  .bet-card.live{border-color:#1a1a1a;}
  .card-top{padding:18px 20px 14px;display:grid;grid-template-columns:1fr auto;gap:16px;align-items:start;}
  .bet-title{font-size:16px;font-weight:600;margin-bottom:6px;line-height:1.3;}
  .tags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px;}
  .tag{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700;}
  .tag.for{background:#dcfce7;color:#15803d;}
  .tag.against{background:#fee2e2;color:#b91c1c;}
  .tag.live-tag{background:#1a1a1a;color:#fff;}
  .tag.paper{background:#f0ede8;color:#999;border:1px solid #ddd;}
  .tag.ec{background:#eff6ff;color:#1d4ed8;}
  .tag.sp{background:#fff7ed;color:#c2410c;}
  .tag.po{background:#fdf4ff;color:#7e22ce;}
  .tag.co{background:#f0fdf4;color:#15803d;}
  .reason-short{font-size:13px;color:#777;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .closes{font-size:12px;color:#bbb;margin-top:7px;}
  .closes b{color:#666;}
  .hint{font-size:11px;color:#bbb;margin-top:6px;font-style:italic;}

  /* right */
  .bet-right{text-align:right;flex-shrink:0;}
  .ev-big{font-size:26px;font-weight:900;color:#15803d;line-height:1;}
  .ev-sub{font-size:11px;color:#bbb;}
  .odds{font-size:12px;color:#aaa;margin-top:5px;}
  .odds .site{color:#b91c1c;font-weight:700;}
  .odds .ours{color:#15803d;font-weight:700;}
  .pips{display:flex;justify-content:flex-end;gap:3px;margin-top:5px;}
  .pip{width:8px;height:8px;border-radius:50%;background:#e5e5e5;}
  .pip.on{background:#1a1a1a;}
  .trend{font-size:11px;font-weight:700;margin-top:3px;}
  .trend.up{color:#15803d;}
  .trend.down{color:#b91c1c;}
  .trend.flat{color:#aaa;}

  /* mini sparkline */
  .card-chart{padding:0 20px 14px;border-top:1px solid #f0ede8;background:#faf9f7;}
  .spark-wrap{height:48px;margin-top:10px;}

  /* ── MODAL ── */
  .overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;backdrop-filter:blur(2px);}
  .overlay.open{display:block;}
  .modal{position:fixed;top:0;right:-100%;width:min(680px,100%);height:100%;background:#fff;z-index:201;transition:right .25s cubic-bezier(.4,0,.2,1);overflow-y:auto;display:flex;flex-direction:column;}
  .modal.open{right:0;}
  .modal-header{padding:20px 24px 16px;border-bottom:1px solid #f0ede8;display:flex;align-items:flex-start;justify-content:space-between;position:sticky;top:0;background:#fff;z-index:5;}
  .modal-title{font-size:18px;font-weight:700;line-height:1.3;max-width:calc(100% - 40px);}
  .close-btn{width:32px;height:32px;border-radius:50%;border:none;background:#f0ede8;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-left:12px;}
  .close-btn:hover{background:#e0ddd8;}
  .modal-body{padding:24px;flex:1;}

  /* modal sections */
  .msec{margin-bottom:28px;}
  .msec-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:#999;margin-bottom:12px;}

  /* verdict bar */
  .verdict-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:24px;}
  .verdict-box{border-radius:10px;padding:14px 16px;text-align:center;}
  .verdict-box .vn{font-size:22px;font-weight:900;line-height:1;}
  .verdict-box .vl{font-size:11px;color:#666;margin-top:3px;}
  .verdict-box.green{background:#dcfce7;}
  .verdict-box.red{background:#fee2e2;}
  .verdict-box.blue{background:#eff6ff;}

  /* chart container */
  .chart-box{background:#faf9f7;border:1.5px solid #f0ede8;border-radius:10px;padding:16px;margin-bottom:16px;}
  .chart-box canvas{width:100%!important;max-height:200px;}
  .chart-title{font-size:12px;font-weight:700;color:#555;margin-bottom:10px;}

  /* sources table */
  .sources-table{width:100%;border-collapse:collapse;}
  .sources-table th{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:#999;text-align:left;padding:6px 10px;border-bottom:1.5px solid #f0ede8;}
  .sources-table td{padding:10px 10px;border-bottom:1px solid #f7f5f2;font-size:13px;vertical-align:middle;}
  .sources-table tr:last-child td{border-bottom:none;}
  .src-name{font-weight:600;color:#1a1a1a;}
  .src-meta{font-size:11px;color:#aaa;margin-top:1px;}
  .src-val{font-weight:700;}
  .src-val.up{color:#b91c1c;}
  .src-val.down{color:#15803d;}
  .src-val.neutral{color:#1d4ed8;}
  .src-check{font-size:16px;}
  .arrow-up::before{content:'↑ ';}
  .arrow-down::before{content:'↓ ';}

  /* reasoning */
  .reasoning-text{font-size:14px;color:#444;line-height:1.65;background:#faf9f7;border-radius:8px;padding:16px;}
  .reasoning-text p{margin-bottom:10px;}
  .reasoning-text p:last-child{margin-bottom:0;}

  /* EV math */
  .ev-math{background:#f0fdf4;border:1px solid #bbf7d0;border-radius:8px;padding:14px 16px;font-size:13px;color:#15803d;}
  .ev-math strong{font-size:16px;}

  /* kalshi link */
  .kalshi-btn{display:block;text-align:center;background:#1a1a1a;color:#fff;text-decoration:none;padding:14px;border-radius:10px;font-weight:700;font-size:15px;margin-top:20px;transition:.15s;}
  .kalshi-btn:hover{background:#333;}

  .empty-msg{padding:32px;text-align:center;color:#bbb;font-style:italic;}

  @media(max-width:600px){
    .stats-row{grid-template-columns:repeat(2,1fr);}
    .card-top{grid-template-columns:1fr;}
    .bet-right{text-align:left;}
    .pips{justify-content:flex-start;}
    .verdict-row{grid-template-columns:1fr 1fr;}
  }
</style>
</head>

    'BLS Import Price Index':       { key:'BLS Import Prices|import_pct', unit:'% MoM', desc:'Tariff leading indicator (1-2mo lead)' },
    'BLS PPI Finished Goods':       { key:'BLS PPI|ppi_pct',             unit:'% MoM', desc:'Factory prices → CPI' },
    'BLS PPI':                      { key:'BLS PPI|ppi_pct',             unit:'% MoM', desc:'Factory prices → CPI' },
    'BLS CPI Energy Component':     { key:'BLS CPI Energy|energy_cpi_pct',unit:'% MoM',desc:'Energy = 7% of CPI basket' },
    'EIA Gas Prices':               { key:'EIA Gas|avg_price_usd',       unit:'$/gal', desc:'Weekly retail gas' },

    'NY Fed Staff Nowcast':         { key:'NY Fed Nowcast|gdp_pct',       unit:'%',     desc:'Independent GDP model' },
    'Trading Economics consensus':  { key:null,                           unit:'%',     desc:'Market consensus', value:'1.8', dir:'neutral' },
    'ESPN NHL Standings (March 26, 2026)': { key:null,                    unit:'',      desc:'Live standings', value:'Live', dir:'neutral' },
    'ESPN EPL Standings (March 26, 2026)': { key:null,                    unit:'',      desc:'Live standings', value:'Live', dir:'neutral' },
    'Wikipedia — Cuban heads of state':    { key:null,                    unit:'',      desc:'Historical tenure data', value:'Avg 18yr', dir:'neutral' },
    'JCPOA historical timeline (State Dept)': { key:null,                 unit:'',      desc:'Deal took 21 months', value:'21mo', dir:'neutral' },
    'SpaceX official announcements':       { key:null,                    unit:'',      desc:'Launch cadence data', value:'~51d avg', dir:'neutral' },
    'Wikipedia Starship flight test history': { key:null,                 unit:'',      desc:'Flight 5→8: 46, 57, 49d gaps', value:'Confirmed', dir:'neutral' },
    'Bloomberg SpaceX coverage':           { key:null,                    unit:'',      desc:'Launch slipped to April', value:'April', dir:'neutral' },
    'Elon Musk public statements':         { key:null,                    unit:'',      desc:'"Not anytime soon"', value:'Bearish', dir:'down' },
    'Reuters Cuba coverage':               { key:null,                    unit:'',      desc:'No coup/health signals', value:'Stable', dir:'down' },
    'Current news scan':                   { key:null,                    unit:'',      desc:'No counter-evidence found', value:'Clear', dir:'neutral' },
    'Reuters Iran coverage':               { key:null,                    unit:'',      desc:'Talks described as preliminary', value:'Early stage', dir:'down' },
  };

  return src.map(name => {
    const info = KNOWN[name];
    if (!info) return null;
    const reading = info.key ? sourceMap[info.key] : null;
    const val  = reading ? reading.value + info.unit : (info.value || '—');
    const dir  = reading?.direction || info.dir || 'neutral';
    const confirmed = !!reading;
    return { name, desc: info.desc, val, dir, confirmed };
  }).filter(Boolean);
}

// ── Open modal ─────────────────────────────────────────────────────────
function openBet(ticker) {
  const b = allBets.find(x=>x.ticker===ticker);
  if (!b) return;

  // Destroy old charts
  modalCharts.forEach(c=>c.destroy());
  modalCharts = [];

  const history    = histMap[ticker] || [];
  const isFOR      = b.side === 'YES';
  const ev         = parseFloat(b.ev_per_10||0);
  const modelP     = parseFloat(b.model_p||0);
  const mktMid     = parseFloat(b.mkt_mid||0);
  const conf       = parseInt(b.confidence||0);
  const data       = BET_DATA[ticker] || {};

  // Detect bracket market (KXECONSTATCPI series)
  const isBracket  = ticker.startsWith('KXECONSTATCPI');
  const eventBase  = ticker.replace(/-T[-\d.]+$/, ''); // e.g. KXECONSTATCPI-26APR
  // Extract active bucket tick (e.g. T0.4 → "0.4%", T-0.2 → "-0.2%")
  const tickPart   = ticker.match(/-T([-\d.]+)$/)?.[1];
  const activeTick = tickPart != null ? parseFloat(tickPart).toFixed(1).replace('.0','')+'%' : null;
  const srcs    = relevantSources(ticker);

  // Trend vs yesterday
  let trendHtml = '';
  if (history.length >= 2) {
    const delta = ev - parseFloat(history[history.length-2]?.ev_per_10||0);
    if (Math.abs(delta) > 0.05) {
      trendHtml = `<div style="font-size:13px;font-weight:700;margin-top:6px;color:${delta>0?'#15803d':'#b91c1c'}">${delta>0?'↑ Better':'↓ Worse'} than yesterday by $${Math.abs(delta).toFixed(2)}/10</div>`;
    }
  }

  // EV math
  const FEE = 0.07;
  const evMath = isFOR
    ? `Buy YES @ ${Math.round(mktMid*100)}¢ ask. Win: ${((1-mktMid)*(1-FEE)*100).toFixed(1)}¢ net per dollar. EV = ${(modelP*100).toFixed(0)}% × ${((1-mktMid)*(1-FEE)*100).toFixed(1)}¢ − ${((1-modelP)*mktMid*100).toFixed(1)}¢ = <strong>+${(ev).toFixed(2)}¢ per dollar</strong>`
    : `Buy NO @ ${Math.round((1-mktMid)*100)}¢. Win: ${(mktMid*(1-FEE)*100).toFixed(1)}¢ net per dollar. EV = ${((1-modelP)*100).toFixed(0)}% × ${(mktMid*(1-FEE)*100).toFixed(1)}¢ − ${(modelP*(1-mktMid)*100).toFixed(1)}¢ = <strong>+${(ev).toFixed(2)}¢ per dollar</strong>`;

  document.getElementById('modal-title').textContent = b.title || ticker;
  document.getElementById('modal-body').innerHTML = `
    <!-- Verdict boxes -->
    <div class="verdict-row">
      <div class="verdict-box ${isFOR?'green':'red'}">
        <div class="vn">${isFOR?'✅ FOR IT':'❌ AGAINST'}</div>
        <div class="vl">Our call</div>
      </div>
      <div class="verdict-box blue">
        <div class="vn" style="color:#15803d">+$${ev.toFixed(2)}</div>
        <div class="vl">Expected per $10${trendHtml}</div>
      </div>
      <div class="verdict-box" style="background:#faf9f7">
        <div class="vn" style="font-size:14px">${daysLeft(b.closes)||'—'}</div>
        <div class="vl">Settles ${fmtDate(b.closes)}</div>
      </div>
    </div>

    <!-- Price history chart -->
    <div class="msec">
      <div class="msec-title">Price history — market vs our EV</div>
      <div class="chart-box">
        <div style="height:190px"><canvas id="mc-history"></canvas></div>
        ${history.length < 2 ? '<div style="text-align:center;font-size:12px;color:#bbb;margin-top:6px">More data points appear daily as the check-in runs</div>' : ''}
      </div>
    </div>

    <!-- Model vs market chart -->
    <div class="msec">
      <div class="msec-title">${isBracket ? 'This specific bucket' : 'Probability comparison'} — market vs our model</div>
      <div class="chart-box">
        <div style="height:90px"><canvas id="mc-model"></canvas></div>
        <div style="font-size:11px;color:#999;margin-top:8px;padding:0 4px">${eqEsc(evMath)}</div>
      </div>
    </div>

    <!-- CPI bracket distribution (only for bracket markets) -->
    ${isBracket ? `<div class="msec">
      <div class="msec-title">Full CPI probability distribution — all buckets</div>
      <div class="chart-box">
        <div style="height:200px"><canvas id="mc-bracket"></canvas></div>
        <div style="font-size:11px;color:#666;margin-top:10px;padding:0 4px">
          Red bar = the bucket this market covers (highlighted) &nbsp;·&nbsp; 
          <span style="color:#94a3b8">■</span> Gray = market pricing &nbsp;·&nbsp;
          <span style="color:#86efac">■</span> Green = our model &nbsp;·&nbsp;
          The <strong>&gt;0.65%</strong> bucket has no Kalshi market (73% of model probability)
        </div>
      </div>
    </div>` : ''}

    <!-- Why -->
    <div class="msec">
      <div class="msec-title">Why we made this bet</div>
      <div class="reasoning-text">${data.why||'<p>See active_bets.json for reasoning.</p>'}</div>
    </div>

    <!-- Sources -->
    ${srcs.length ? `<div class="msec">
      <div class="msec-title">Data sources confirming this bet</div>
      <table class="sources-table">
        <thead><tr><th></th><th>Source</th><th>Reading</th><th>Note</th></tr></thead>
        <tbody>${srcs.map(s=>`<tr>
          <td class="src-check">${s.confirmed?'✅':'📋'}</td>
          <td><div class="src-name">${esc(s.name)}</div></td>
          <td class="src-val ${s.dir}">${s.dir==='UP'?'↑ ':'↓ '}${esc(s.val)}</td>
          <td class="src-meta">${esc(s.desc)}</td>
        </tr>`).join('')}</tbody>
      </table>
      <div style="font-size:11px;color:#bbb;margin-top:8px">✅ = live from Supabase today &nbsp;·&nbsp; 📋 = reference/historical</div>
    </div>` : ''}

    <!-- Settles -->
    <div class="msec">
      <div class="msec-title">Settlement</div>
      <div style="font-size:13px;color:#555">${esc(data.settles||fmtDate(b.closes))}</div>
    </div>

    <a class="kalshi-btn" href="${kalshiUrl(ticker)}" target="_blank">Place this bet on Kalshi →</a>
  `;

  // Render charts after DOM update
  setTimeout(() => {
    drawModalChart('mc-history', history);
    drawModelChart('mc-model', modelP, mktMid, isFOR);
    if (isBracket) drawBracketChart('mc-bracket', eventBase, activeTick);
  }, 50);

  document.getElementById('overlay').classList.add('open');
  document.getElementById('modal').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function eqEsc(s) { return s; } // allow bold tags through

function closeModal() {
  document.getElementById('overlay').classList.remove('open');
  document.getElementById('modal').classList.remove('open');
  document.body.style.overflow = '';
}
document.addEventListener('keydown', e => { if(e.key==='Escape') closeModal(); });

// ── Build source map from readings ─────────────────────────────────────
function buildSourceMap(readings) {
  readings.forEach(r => {
    const k = r.source+'|'+r.metric;
    if (!sourceMap[k] || r.fetched_at > sourceMap[k].fetched_at) sourceMap[k] = r;
  });
}

// ── Card HTML ──────────────────────────────────────────────────────────
function cardHTML(b) {
  const isLive = b.status==='LIVE';
  const isFOR  = b.side==='YES';
  const ev     = parseFloat(b.ev_per_10||0);
  const modelP = Math.round(parseFloat(b.model_p||0)*100);
  const mktP   = Math.round(parseFloat(b.mkt_mid||0)*100);
  const conf   = parseInt(b.confidence||0);
  const cat    = (b.category||'').toLowerCase();
  const history= histMap[b.ticker]||[];
  const canvasId = 'spark-'+b.ticker.replace(/[^a-z0-9]/gi,'-');

  // Trend
  let trendCls='flat', trendTxt='→ unchanged';
  if (history.length>=2) {
    const delta = ev - parseFloat(history[history.length-2]?.ev_per_10||0);
    if (delta>0.05){ trendCls='up'; trendTxt=`↑ +$${delta.toFixed(2)} since yesterday`; }
    else if(delta<-0.05){ trendCls='down'; trendTxt=`↓ $${delta.toFixed(2)} since yesterday`; }
  }

  const pips = Array.from({length:10},(_,i)=>`<div class="pip${i<conf?' on':''}"></div>`).join('');

  return `<div class="bet-card${isLive?' live':''}" onclick="openBet('${b.ticker}')">
    <div class="card-top">
      <div>
        <div class="bet-title">${esc(b.title||b.ticker)}</div>
        <div class="tags">
          <span class="tag ${isFOR?'for':'against'}">${isFOR?'FOR IT':'AGAINST'}</span>
          <span class="tag ${CAT[cat]||'paper'}">${esc(b.category||'')}</span>
          <span class="tag ${isLive?'live-tag':'paper'}">${isLive?'LIVE':'Paper'}</span>
        </div>
        <div class="hint">Click to see full breakdown &amp; charts</div>
      </div>
      <div class="bet-right">
        <div class="ev-big">+$${ev.toFixed(2)}</div>
        <div class="ev-sub">per $10</div>
        <div class="odds">Site: <span class="site">${mktP}%</span> → Ours: <span class="ours">${modelP}%</span></div>
        <div class="pips">${pips}</div>
        <div class="trend ${trendCls}">${trendTxt}</div>
      </div>
    </div>
    <div class="card-chart">
      <div class="spark-wrap"><canvas id="${canvasId}" height="48"></canvas></div>
    </div>
  </div>`;
}

// ── Main ───────────────────────────────────────────────────────────────
async function refresh() {
  document.getElementById('upd').textContent = 'Refreshing...';

  const [bets, history, readings, perf] = await Promise.all([
    sb('open_bets','*'),
    sb('price_history','ticker,recorded_at,market_mid,ev_per_10,confidence,model_p&order=recorded_at.asc'),
    sb('source_readings','source,metric,value,direction,period,fetched_at&order=fetched_at.desc'),
    sb('bet_performance','*'),
  ]);

  if (!Array.isArray(bets)) return;

  allBets = bets;

  // Build maps
  if (Array.isArray(history)) {
    histMap = {};
    history.forEach(h => { (histMap[h.ticker]=histMap[h.ticker]||[]).push(h); });
  }
  if (Array.isArray(readings)) buildSourceMap(readings);

  // Counts
  const top = [...bets].sort((a,b)=>parseFloat(b.ev_per_10)-parseFloat(a.ev_per_10))[0];
  document.getElementById('s1').textContent = bets.length;
  document.getElementById('s3').textContent = top?'+$'+parseFloat(top.ev_per_10).toFixed(2):'—';

  // Inflation signal count
  let upSig=0;
  if (Array.isArray(readings)) {
    const latest={};
    readings.forEach(r=>{const k=r.source+'|'+r.metric;if(!latest[k])latest[k]=r;});
    ['Cleveland Fed|cpi_mom','BLS Import Prices|import_pct','BLS PPI|ppi_pct','BLS CPI Energy|energy_cpi_pct','EIA Gas|avg_price_usd'].forEach(k=>{if(latest[k]?.direction==='UP')upSig++;});
  }
  document.getElementById('s4').textContent = upSig+'/5';

  // Settling soon banner (next 14 days)
  const today = new Date(); today.setHours(0,0,0,0);
  const soon = bets.filter(b => {
    if (!b.closes) return false;
    const d = new Date(b.closes); d.setHours(0,0,0,0);
    return (d - today) / 86400000 <= 14;
  }).sort((a,b) => new Date(a.closes) - new Date(b.closes));
  const settlingBanner = document.getElementById('settling-banner');
  const settlingList   = document.getElementById('settling-list');
  if (soon.length) {
    settlingBanner.style.display = 'block';
    settlingList.innerHTML = soon.map(b => {
      const d = Math.ceil((new Date(b.closes) - today) / 86400000);
      return `<span style="margin-right:16px">📅 <strong>${b.ticker}</strong> ${b.side} — closes in <strong>${d} day${d===1?'':'s'}</strong></span>`;
    }).join('<br>');
  } else {
    settlingBanner.style.display = 'none';
  }

  // Render cards
  const live  = bets.filter(b=>b.status==='LIVE');
  const paper = bets.filter(b=>b.status!=='LIVE').sort((a,b)=>parseFloat(b.ev_per_10)-parseFloat(a.ev_per_10));

  if (live.length) {
    document.getElementById('live-title').style.display='block';
    document.getElementById('live-bets').innerHTML = live.map(cardHTML).join('');
  }
  document.getElementById('all-bets').innerHTML = paper.map(cardHTML).join('') || '<div class="empty-msg">No tracked bets</div>';

  // Draw mini sparklines
  setTimeout(() => {
    bets.forEach(b => {
      const h = histMap[b.ticker]||[];
      const canvasId = 'spark-'+b.ticker.replace(/[^a-z0-9]/gi,'-');
      drawMiniChart(canvasId, h);
    });
  }, 100);

  // Performance
  if (Array.isArray(perf) && perf.length) {
    const totalPnl = perf.reduce((s,p)=>s+parseFloat(p.real_pnl||0),0);
    const pnlEl = document.getElementById('s2');
    pnlEl.textContent = (totalPnl>=0?'+$':'-$')+Math.abs(totalPnl).toFixed(2);
    pnlEl.className = 'n'+(totalPnl>0?' g':'');
    document.getElementById('perf').innerHTML = perf.map(p=>{
      const pnl=parseFloat(p.real_pnl||0),res=parseInt(p.resolved||0),wins=parseInt(p.wins||0);
      return `<div style="background:#fff;border:1.5px solid #e8e5e0;border-radius:10px;padding:14px 18px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center">
        <div><div style="font-weight:600">${esc(p.category)}</div>
        <div style="font-size:12px;color:#aaa;margin-top:2px">${p.total} tracked · ${res} settled${res>0?` · ${Math.round(wins/res*100)}% win rate`:''}</div></div>
        <div style="font-size:20px;font-weight:800;color:${pnl>0?'#15803d':'#ccc'}">${pnl!==0?(pnl>0?'+$':'-$')+Math.abs(pnl).toFixed(2):'—'}</div>
      </div>`;
    }).join('');
  } else {
    document.getElementById('perf').innerHTML = '<div class="empty-msg">First bets settle April 30. P&L appears here.</div>';
  }

  document.getElementById('upd').textContent = 'Updated '+new Date().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
}

refresh();
setInterval(refresh, 5*60*1000);
</script>
</body>
</html>
